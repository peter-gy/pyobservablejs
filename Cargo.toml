[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/peter-gy/pyobservablejs"
publish = false

[workspace.dependencies]
pyobservablejs-engine = { path = "crates/pyobservablejs-engine" }

# deno_core, deno_web, deno_webidl, and deno_error move together with the V8
# archives pinned in packages/pyobservablejs/native-archives.json.
deno_core = { version = "=0.412.0", features = ["include_icu_data"] }
deno_error = "=0.7.1"
deno_web = "=0.290.0"
deno_webidl = "=0.259.0"

base64 = "=0.23.1"
getrandom = "=0.4.3"
percent-encoding = "=2.3.2"
pyo3 = { version = "=0.30.1", features = ["abi3-py311"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "macros"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "platform-verifier", "gzip", "brotli"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
