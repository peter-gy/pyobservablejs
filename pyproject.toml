[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyobservablejs"
version = "0.0.0rc1"
description = "Observable JavaScript notebooks as reusable Python widgets"
readme = "README.md"
license = "MIT"
authors = [{ name = "Peter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
maintainers = [{ name = "Peter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.10,<3.15"
keywords = ["anywidget", "jupyter", "marimo", "notebooks", "observable", "visualization"]
dependencies = ["anywidget>=0.11.0", "traitlets>=5"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/peterg-y/pyobservablejs"
Source = "https://github.com/peterg-y/pyobservablejs"
Issues = "https://github.com/peterg-y/pyobservablejs/issues"

[dependency-groups]
dev = [
	"watchfiles",
	"jupyterlab",
	"ruff>=0.15.14",
	"ty>=0.0.39",
	"pytest>=9.0.3",
	"marimo[recommended]>=0.23.8",
	"jupyter-book>=2.1.5",
]


[tool.hatch.build]
only-packages = true
artifacts = ["src/pyobservablejs/static/**"]

[tool.hatch.build.targets.sdist.force-include]
"js" = "js"
"package.json" = "package.json"
"pnpm-lock.yaml" = "pnpm-lock.yaml"
"pnpm-workspace.yaml" = "pnpm-workspace.yaml"

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/pyobservablejs/static/widget.js", "src/pyobservablejs/static/widget.css"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "pnpm"
build_cmd = "build"
