[build-system]
requires = ["agent-plugins>=0.2", "maturin>=1.15,<2"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "pyobservablejs"
version = "0.3.0"
description = "Observable notebooks as Python widgets and headless computations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
maintainers = [{ name = "Peter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.11"
keywords = ["anywidget", "jupyter", "marimo", "notebooks", "observable", "visualization"]
dependencies = ["agent-plugins>=0.2", "anywidget>=0.11.0", "anywidget-bundle>=0.1.1", "traitlets>=5"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
chromium = ["playwright>=1.56"]

[project.urls]
Homepage = "https://github.com/peter-gy/pyobservablejs"
Documentation = "https://peter-gy.github.io/pyobservablejs/"
Source = "https://github.com/peter-gy/pyobservablejs"
Issues = "https://github.com/peter-gy/pyobservablejs/issues"

[project.entry-points."marimo.agent.capability"]
pyobservablejs = "observablejs.agent"

[dependency-groups]
dev = ["hatchling==1.31.0", "maturin>=1.15,<2", "watchfiles"]
release = ["agent-plugins>=0.2", "hatchling==1.31.0"]

[tool.maturin]
manifest-path = "../engine-python/Cargo.toml"
python-source = "src"
module-name = "observablejs._engine"
locked = true
include = [
	{ path = "build_backend.py", format = "sdist" },
	{ path = "native_build.py", format = "sdist" },
	{ path = "native-archives.json", format = "sdist" },
	{ path = "hatch_build.py", format = "sdist" },
	{ path = "src/observablejs/static/**/*", format = [
		"sdist",
		"wheel",
	] },
]
exclude = ["src/observablejs/**/__pycache__/**", "src/observablejs/_engine*.so", "src/observablejs/_engine*.pyd"]

# Hatch builds the pure py3-none-any wheel from the same sources.
[tool.hatch.build]
only-packages = true
artifacts = ["src/observablejs/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/observablejs"]
exclude = ["src/observablejs/_engine*"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [
	{ file = "pyproject.toml" },
	{ file = "native_build.py" },
	{ file = "native-archives.json" },
	{ file = "build_backend.py" },
	{ file = "../../Cargo.toml" },
	{ file = "../../Cargo.lock" },
	{ file = "../engine-python/Cargo.toml" },
	{ file = "../engine-python/src/**/*.rs" },
	{ file = "../engine-rust/Cargo.toml" },
	{ file = "../engine-rust/build.rs" },
	{ file = "../engine-rust/src/**/*" },
	{ file = "../engine-rust/bundle/*.js" },
]

[tool.agent-plugins]
root = "../.."
