name: Publish package

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Check release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Release commit $commit must belong to main" >&2
            exit 1
          fi
          ci_run="$(gh run list \
            --workflow ci.yml \
            --branch main \
            --commit "$commit" \
            --event push \
            --limit 1 \
            --json status,conclusion,url \
            --jq 'if length == 0 then "" else (.[0] | [.status, .conclusion, .url] | .[]) end')"
          if [ -z "$ci_run" ]; then
            echo "No main CI run found for $commit" >&2
            exit 1
          fi
          {
            IFS= read -r ci_status
            IFS= read -r ci_conclusion
            IFS= read -r ci_url
          } <<< "$ci_run"
          if [ "$ci_status" != completed ] || [ "$ci_conclusion" != success ]; then
            printf 'Main CI must pass before releasing: %s/%s\n%s\n' \
              "$ci_status" "${ci_conclusion:-pending}" "$ci_url" >&2
            exit 1
          fi

      - name: Check release version
        run: |
          package_version="$(uv version --package pyobservablejs --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Package version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
            echo "Release tag $GITHUB_REF_NAME must be annotated" >&2
            exit 1
          fi

  distributions:
    needs: release
    uses: ./.github/workflows/wheels.yml

  publish:
    needs: distributions
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{native-*,pure,source}"
          merge-multiple: true
          path: dist/

      - name: Publish native wheels, the pure wheel, and the source archive
        run: uv publish --trusted-publishing always dist/pyobservablejs-*.whl dist/pyobservablejs-*.tar.gz

  verify-pypi:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Verify the public PyPI release
        env:
          UV_NO_CONFIG: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 18); do
            if uv run --no-cache --no-project --isolated \
              --default-index https://pypi.org/simple \
              --with "pyobservablejs==$version" \
              python scripts/verify_release.py "$version" --wheel native; then
              exit 0
            fi
            printf 'PyPI verification attempt %s of 18 did not verify %s\n' "$attempt" "$version"
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          echo "PyPI did not verify pyobservablejs $version within three minutes" >&2
          exit 1

  release-notes:
    needs: verify-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Update release notes
        run: pixi run npx changelogithub@14.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
