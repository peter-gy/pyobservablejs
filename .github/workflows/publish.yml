name: Publish package

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check release version
        run: |
          package_version="$(uv version --package pyobservablejs --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Package version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
            echo "Release tag $GITHUB_REF_NAME must be annotated" >&2
            exit 1
          fi

      - name: Build package artifacts
        run: |
          rm -rf dist
          make build

      - name: Check package artifacts
        run: |
          package_version="$(uv version --package pyobservablejs --short)"
          uvx twine check dist/pyobservablejs-*.whl dist/pyobservablejs-*.tar.gz
          uv build --wheel dist/pyobservablejs-*.tar.gz --out-dir dist/from-sdist
          uv run --no-project --isolated --with dist/pyobservablejs-*.whl \
            python scripts/verify_release.py "$package_version"
          uv run --no-project --isolated --with dist/from-sdist/pyobservablejs-*.whl \
            python scripts/verify_release.py "$package_version"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/pyobservablejs-*.whl
            dist/pyobservablejs-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish package
        run: uv publish --trusted-publishing always dist/pyobservablejs-*.whl dist/pyobservablejs-*.tar.gz

  verify-pypi:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Verify the public PyPI release
        env:
          UV_NO_CONFIG: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 18); do
            if uv run --no-cache --no-project --isolated \
              --default-index https://pypi.org/simple \
              --with "pyobservablejs==$version" \
              python scripts/verify_release.py "$version"; then
              exit 0
            fi
            printf 'PyPI verification attempt %s of 18 did not verify %s\n' "$attempt" "$version"
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          echo "PyPI did not verify pyobservablejs $version within three minutes" >&2
          exit 1

  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Update release notes
        run: npx changelogithub@14.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
