name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Run JavaScript tests
        run: pixi run test-js

      - name: Build JavaScript packages and test the Node inspection entry point
        run: pixi run test-inspect

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          rust: "true"

      - name: Check JavaScript, docs, and TOML
        run: pixi run check-js

      - name: Check Python
        run: pixi run check-python

      - name: Check Rust
        run: pixi run check-rust

      - name: Lint workflows and whitespace
        run: |
          pixi run lint-workflows
          git diff --check

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [py311, default, py313, py314]
    env:
      PIXI_ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          environment: ${{ matrix.environment }}
          rust: "true"

      - name: Install the workspace and Chromium
        run: |
          pixi run -e "$PIXI_ENVIRONMENT" install
          pixi run -e "$PIXI_ENVIRONMENT" uv run --frozen playwright install --with-deps --no-shell chromium

      - name: Run Python tests
        run: pixi run -e "$PIXI_ENVIRONMENT" test-python

  floors:
    # The Playwright floor supports Ubuntu releases up to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          environment: py311
          rust: "true"

      - name: Install Chromium system libraries
        run: pixi run -e py311 uv run --no-project --with playwright playwright install-deps chromium

      - name: Test declared dependency floors
        run: pixi run -e py311 test-floors

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          rust: "true"

      - name: Install Chromium
        run: pixi run install-browser

      - name: Run browser tests
        run: pixi run test-e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  distributions:
    uses: ./.github/workflows/wheels.yml

  required:
    if: always()
    needs: [test-js, quality, test-python, floors, e2e, distributions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            printf 'Required jobs did not succeed:\n%s\n' "$failed" >&2
            exit 1
          fi
