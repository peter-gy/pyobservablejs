name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check JavaScript formatting, linting, and types
        run: vp run check

      - name: Check Python formatting, linting, and types
        run: |
          uv lock --check
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen ty check packages/pyobservablejs scripts
          uv run --frozen pyrefly check --min-severity warn

      - name: Check whitespace
        run: git diff --check

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build widget assets
        run: vp run -F @pyobservablejs/python build

      - name: Run Python tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --frozen pytest -q packages/pyobservablejs/tests

  test-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Run JavaScript tests
        run: vp run -r test

      - name: Build JavaScript packages
        run: vp run -F './packages/*' build

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build package artifacts
        run: |
          rm -rf dist
          make build

      - name: Check package artifacts
        run: |
          uvx twine check dist/pyobservablejs-*.whl dist/pyobservablejs-*.tar.gz
          uv build --wheel dist/pyobservablejs-*.tar.gz --out-dir dist/from-sdist
          uv run --no-project --with dist/from-sdist/pyobservablejs-*.whl python -c "import observablejs"

  required:
    if: always()
    needs: [quality, test-python, test-js, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST_PYTHON: ${{ needs.test-python.result }}
          TEST_JS: ${{ needs.test-js.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          if [ "$QUALITY" != success ] || \
             [ "$TEST_PYTHON" != success ] || \
             [ "$TEST_JS" != success ] || \
             [ "$PACKAGE" != success ]; then
            printf 'Required jobs: quality=%s test-python=%s test-js=%s package=%s\n' \
              "$QUALITY" "$TEST_PYTHON" "$TEST_JS" "$PACKAGE" >&2
            exit 1
          fi
