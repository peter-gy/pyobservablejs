  - undici@7.29.0
  - fast-uri@3.1.5
  - mermaid@11.16.1
  - js-yaml@3.15.1 || 4.3.1
  - dompurify@3.4.13
  - nanoid@3.3.18

overrides:
  dompurify@<=3.4.12: 3.4.13
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  minimatch@>=9.0.0 <9.0.7: 9.0.9
  nanoid@<3.3.18: 3.3.18
  serialize-javascript@<=7.0.4: 7.0.5
  undici@>=7.0.0 <7.29.0: 7.29.0
  uuid@<11.1.1: 11.1.1
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@manzt/uv": true
  core-js: true
  esbuild: true
