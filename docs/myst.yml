version: 1
project:
  title: pyobservablejs
  description: Observable JavaScript notebooks as reusable Python widgets.
  keywords:
    - observable
    - anywidget
    - jupyter
    - marimo
    - notebooks
  github: https://github.com/peter-gy/pyobservablejs
  license: MIT
  exclude:
    - .jupyter-book-marimo/**
  plugins:
    - type: executable
      path: ../.venv/bin/jupyter-book-marimo
  toc:
    - file: index.md
    - file: quickstart.md
    - file: examples.md
    - file: tutorials/index.md
    - file: tutorials/python-variables.md
    - file: tutorials/cell-views.md
    - file: concepts.md
    - file: api.md
    - file: architecture.md
    - file: composition.md
    - file: development.md
site:
  template: book-theme
  title: pyobservablejs
  options:
    folders: true
    logo_text: pyobservablejs
