version: 1
project:
  title: pyobservablejs
  description: Observable JavaScript notebooks from Python.
  keywords:
    - observable
    - anywidget
    - jupyter
    - marimo
    - notebooks
  exclude:
    - .jupyter-book-marimo/**
    - _build/**
    - _site/**
  github: https://github.com/peter-gy/pyobservablejs
  license: MIT
  plugins:
    - type: executable
      path: ../.venv/bin/jupyter-book-marimo
  toc:
    - file: index.md
    - file: getting-started.md
    - title: Examples
      children:
        - file: examples/index.md
        - file: examples/python-data-plot.md
        - file: examples/reactive-inputs.md
        - file: examples/html-notebook-files.md
    - title: Guides
      children:
        - file: guides/index.md
        - file: guides/python-variables.md
        - file: guides/cell-values.md
        - file: guides/source-html.md
        - file: guides/author-cells.md
        - file: guides/observablehq.md
        - file: guides/themes.md
        - file: guides/notebook-frontends.md
    - title: Reference
      children:
        - file: reference/index.md
        - file: reference/notebook.md
        - file: reference/cells.md
        - file: reference/variables.md
        - file: reference/source-notebooks.md
        - file: reference/values-and-graph.md
        - file: reference/notebook-themes.md
    - title: Development
      children:
        - file: development.md
        - file: internals/architecture.md
        - file: internals/widget-composition.md
        - file: internals/docs-build.md
site:
  template: book-theme
  title: pyobservablejs
  options:
    folders: true
    logo_text: pyobservablejs
