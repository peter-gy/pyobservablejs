<notebook theme="air">

  <script id="1" name="chart" type="application/vnd.observable.javascript" pinned>

  y: {grid: true, label: "frequency"},
  marks: [

      {letter: "D", frequency: 0.0432},
      {letter: "E", frequency: 0.1202}
    ], {x: "letter", y: "frequency", tip: true})
  ]
})
  </script>
</notebook>
